name: Feature request
description: Suggest an improvement to ALO.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: memory
    attributes:
      label: How would this improve memory or resuming work?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas
      description: Optional. Anything you have in mind for how it could work.
