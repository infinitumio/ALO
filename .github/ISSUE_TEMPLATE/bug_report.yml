name: Bug report
description: Something in ALO is not working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Do not upload your activity history**, databases, exports or screenshots of your timeline. Remove anything personal from logs before pasting them.
  - type: input
    id: version
    attributes:
      label: ALO version
      description: Shown in the menu bar app under About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS 15
        - macOS 14
        - macOS 13
        - Other
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Mac type
      placeholder: "Apple silicon or Intel"
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Remove app titles, file names and anything personal first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included activity history or personal information.
          required: true
